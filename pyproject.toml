[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "susurrus"
version = "2.12.0"
description = "Audio Transcription, TTS & Translation suite with multiple backends"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.25.1",
    "pydub>=0.25.1",
    # EU AI Act Art. 50(2) requires marking that is "robust and reliable as far
    # as is technically feasible", and has no "unless a dependency is missing"
    # clause. These two are what the in-sample watermark is built from, and
    # while they sat in the [tts] extra a bare install could apply nothing but
    # strippable metadata. That mattered for the CrispASR-binary route, which
    # synthesizes without needing any of the Python TTS stack — so the one
    # install that could emit audio with metadata-only marking was also the one
    # that never opted into the marking dependencies. Both ship ubiquitous
    # wheels; the cost of carrying them is far below the cost of the gap.
    "soundfile>=0.12.0",
    "numpy>=1.21",
]

[project.optional-dependencies]
gui = [
    "PyQt6>=6.0.0",
]
gpu = [
    "torch>=1.9.0",
    "torchaudio>=0.9.0",
]
tts = [
    # <7.2 computes the Sec-MS-GEC auth token with a scheme Microsoft has
    # retired, so every request fails the websocket handshake with 403.
    # Measured on one machine minutes apart: 7.0.2 fails, 7.2.8 succeeds.
    "edge-tts>=7.2.0",
    "piper-tts>=1.2.0",
    "kokoro-onnx>=0.4.0",
    "chatterbox-tts>=0.1.2",
    # soundfile and numpy moved to the base dependencies — the in-sample
    # watermark must not be contingent on choosing an extra.
    #
    # C2PA stays an extra, and the reason is not that it matters less. It is a
    # compiled wheel whose platform coverage is narrower than soundfile's, and a
    # hard dependency that fails to install makes the whole tool uninstallable —
    # which marks nothing at all. It is pulled in by [tts], recommended
    # everywhere else, and its absence costs the tamper-evident layer while the
    # in-sample watermark and the declarative floor still apply.
    "susurrus[c2pa]",
]
text-extraction = [
    "pypdfium2>=4.0.0",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12.0",
    "markdown>=3.5.0",
]
dev = [
    # CI installs from here via pip install -e ".[dev]" — single source of truth.
    # Formatters pinned exactly (output must be reproducible across CI + local).
    # Linters/runners use >= (output doesn't need to be identical).
    "ruff>=0.15.20",
    "black==25.9.0",
    "isort==6.1.0",
    "bandit>=1.9.4",
    "pylint>=3.0.0",
    "mypy>=1.7.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
]
c2pa = [
    # C2PA Content Credentials (EU AI Act Art. 50(2)): cryptographically
    # verifiable, tamper-evident provenance. utils/c2pa_signing.py previously
    # imported only `c2pa_audio`, which is not published on any index — so the
    # whole layer was dead on every Python-native TTS path regardless of what
    # the user installed. c2pa-python is the PyPI-installable implementation;
    # cryptography generates the local signing identity it needs.
    "c2pa-python>=0.37.0",
    "cryptography>=41.0",
]
watermark = [
    # Neural AI-content watermarking (EU AI Act Art. 50(2)). Optional because
    # it pulls torch plus model weights. It is no longer the only layer that
    # survives re-encoding — utils/spread_spectrum.py ships in the base TTS
    # install and survives ordinary transcoding — but AudioSeal is learned
    # rather than a fixed-key comb, so it is the one that resists deliberate
    # removal by someone who knows the scheme.
    "audioseal>=0.1.4",
]
all = [
    "susurrus[gui,gpu,tts,text-extraction,c2pa,watermark]",
]

[project.scripts]
susurrus = "main:main"

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.venv
  | venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
split_on_trailing_comma = true
skip_gitignore = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v"

[tool.coverage.run]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]
